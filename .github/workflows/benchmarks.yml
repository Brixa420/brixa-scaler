name: CI

on:
  push:
    branches: [main, brixa-scaler-zk]
  pull_request:
    branches: [main, brixa-scaler-zk]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          cd integration/go
          go mod download
          go test -v -cover ./...

  benchmark:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Go benchmarks
        run: |
          cd integration/go
          go mod download
          go test -bench=. -benchmem -count=5 -run=^$ ./... 2>&1 | tee benchmark.txt
      
      - name: Parse benchmark results
        run: |
          # Extract TPS numbers
          grep -E "Benchmark.*TPS" benchmark.txt || true
      
      - name: Check for regression
        run: |
          # Baseline (these should be updated when known good)
          BASELINE_TPS=750000
          BASELINE_PROOFS=1
          
          # Extract actual TPS from benchmark (simplified)
          # In production, use a parser script
          echo "Checking benchmark results..."
          echo "Baseline: $BASELINE_TPS TPS"
          echo "If results are significantly lower, CI will fail"
          
          # For now, just report - regression detection would need
          # a properly parsing script and baseline storage