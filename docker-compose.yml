version: '3.8'

services:
  brixascaler:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-1000}
      - API_KEY=${API_KEY}
      - RATE_LIMIT_PER_SECOND=${RATE_LIMIT_PER_SECOND:-10}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-20}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-1048576}
      - MAX_GAS_PRICE_GWEI=${MAX_GAS_PRICE_GWEI:-100}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SETTLEMENT_RPC_URL=${SETTLEMENT_RPC_URL}
      - SETTLEMENT_PRIVATE_KEY=${SETTLEMENT_PRIVATE_KEY}
      - MULTISIG_ENABLED=${MULTISIG_ENABLED:-false}
      - MULTISIG_THRESHOLD=${MULTISIG_THRESHOLD:-2}
      - MULTISIG_APPROVERS=${MULTISIG_APPROVERS}
    volumes:
      - ./config:/app/config:ro
    # Security: read-only, no new privileges, limited resources
    security_opt:
      - no-new-privileges:true
    read_only: true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    # Restart policy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring
